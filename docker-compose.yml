# MindooDB Server — Docker Compose
#
# Default paths (relative to the repository root):
#   data directory:  ../mindoodb-data/server
#   password file:   ../mindoodb-data/.server_unlock
#
# Run `bash serversetup.sh` first to build the image, create the data directory,
# and initialise the server identity. serversetup.sh writes a
# `docker-compose.override.yml` with the current host uid/gid, bind mounts,
# runtime network (bridge ports or host), and SELinux relabeling suffixes
# when needed.
#
# Usage:
#   docker compose up -d        # start
#   docker compose down          # stop
#   docker compose logs -f       # follow logs
#   docker compose up -d --build # rebuild image and restart

services:
  mindoodb:
    image: mindoodb-server
    build:
      context: .
      dockerfile: src/node/server/Dockerfile
      # Host network during the image build. Docker's default bridge DNS
      # often fails on OpenWrt/router hosts. Runtime networking is chosen in
      # docker-compose.override.yml (bridge ports or network_mode: host).
      network: host
    restart: unless-stopped
    # Containment, should a flaw in Node or a dependency ever give an attacker
    # code execution in the server process:
    # - read-only root filesystem: the program files cannot be replaced. The
    #   server writes only to /data (bind mount) and, at most, to /tmp.
    # - no Linux capabilities: the process runs as a normal user on port 1661
    #   and needs none.
    # - no-new-privileges: setuid binaries cannot raise its rights.
    # - a process limit against fork bombs.
    # A memory limit depends on the host and the tenants' size; add
    # `mem_limit: 2g` (or similar) in docker-compose.override.yml if wanted.
    # For kernel isolation on top, see "Sandboxed runtime (gVisor)" in
    # README-server.md.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    environment:
      MINDOODB_SERVER_PASSWORD_FILE: /run/secrets/server_unlock
